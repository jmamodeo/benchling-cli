[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchling-agent"
dynamic = ["version"]
description = "Agent-friendly Benchling CLI and local MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Amodeo", email = "120539773+jmamodeo@users.noreply.github.com" }]
keywords = [
  "benchling",
  "eln",
  "cli",
  "mcp",
  "model-context-protocol",
  "lab-automation",
  "laboratory-informatics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "filelock>=3.16",
  "httpx>=0.27,<1",
  "mcp>=1.13,<3",
  "pydantic>=2.8,<3",
  "typer>=0.12,<1",
  "truststore>=0.10,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/jmamodeo/benchling-cli"
Repository = "https://github.com/jmamodeo/benchling-cli"
Issues = "https://github.com/jmamodeo/benchling-cli/issues"
Changelog = "https://github.com/jmamodeo/benchling-cli/blob/main/CHANGELOG.md"

[project.scripts]
benchling = "benchling_agent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "benchling_agent.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
benchling_agent = ["py.typed"]

[tool.setuptools.data-files]
"share/benchling-agent/schemas" = ["schemas/*.json"]
"share/benchling-agent/contracts" = ["contracts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "E501",  # long lines are tolerated; formatter is not enforced
  "B008",  # typer uses call expressions in argument defaults
  "B905",  # zip() strictness would change behavior
  "UP042", # str-mixin enums are part of the public API
  "E402",
]

[tool.mypy]
python_version = "3.11"
files = ["src/benchling_agent"]
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
strict_equality = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = ["benchling_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 96
